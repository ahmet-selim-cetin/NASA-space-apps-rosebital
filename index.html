<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Abandoned but not Forgotten</title>
  <meta name="description" content="An interactive memorial to the rovers we left on Mars — Team Rosebital, NASA Space Apps Challenge." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="stage"></div>

  <!-- Top bar -->
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span><span data-i18n="title.top"></span>&nbsp;<em data-i18n="title.bottom"></em></div>
    <div class="lang-switch" role="group" aria-label="Language">
      <button data-lang="en">EN</button>
      <button data-lang="tr">TR</button>
    </div>
  </header>

  <!-- Intro -->
  <section id="intro" class="intro">
    <div class="intro-inner">
      <p class="eyebrow">NASA Space Apps · Rosebital</p>
      <h1><span data-i18n="title.top"></span><br /><em data-i18n="title.bottom"></em></h1>
      <p class="lead" data-i18n="intro.lead"></p>
      <button id="start" class="btn btn-primary" disabled>
        <span class="loader-text" data-i18n="intro.start"></span>
        <span class="progress"><span id="progress-bar"></span></span>
      </button>
    </div>
  </section>

  <!-- Hint -->
  <p id="hint" class="hint hidden" data-i18n="hint.drag"></p>

  <!-- Rover panel -->
  <aside id="panel" class="panel" aria-hidden="true">
    <button class="panel-close" id="panel-close" aria-label="Close">×</button>
    <p class="eyebrow" id="p-place"></p>
    <h2 id="p-name"></h2>
    <p class="tagline" id="p-tagline"></p>
    <dl class="stats">
      <div><dt data-i18n="panel.landed"></dt><dd id="p-landed"></dd></div>
      <div><dt id="p-last-label"></dt><dd id="p-last"></dd></div>
      <div><dt data-i18n="panel.planned"></dt><dd id="p-planned"></dd></div>
      <div><dt data-i18n="panel.lasted"></dt><dd id="p-lasted"></dd></div>
      <div><dt data-i18n="panel.distance"></dt><dd id="p-distance"></dd></div>
    </dl>
    <div class="actions">
      <button class="btn btn-primary" id="p-drive" disabled><span data-i18n="panel.drive"></span></button>
      <button class="btn btn-ghost" id="p-story" disabled><span data-i18n="panel.soon"></span></button>
    </div>
  </aside>

  <footer class="credit" data-i18n="credit"></footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
