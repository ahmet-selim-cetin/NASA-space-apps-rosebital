<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>The Last Signal</title>
  <meta name="description" content="An interactive memorial to the rovers we left on Mars — Team Rosebital, NASA Space Apps Challenge." />
  <link rel="canonical" href="https://ahmet-selim-cetin.github.io/NASA-space-apps-rosebital/" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon.ico" sizes="any" />

  <!-- Open Graph / social share card -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Team Rosebital · NASA Space Apps Challenge" />
  <meta property="og:title" content="The Last Signal" />
  <meta property="og:description" content="An interactive memorial to the rovers we left on Mars — spin the globe, meet Opportunity, Spirit, Sojourner and Ingenuity. Team Rosebital, NASA Space Apps Challenge." />
  <meta property="og:url" content="https://ahmet-selim-cetin.github.io/NASA-space-apps-rosebital/" />
  <meta property="og:image" content="https://ahmet-selim-cetin.github.io/NASA-space-apps-rosebital/img/share-card.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Rosebital, GZOAL Tech Team" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:locale:alternate" content="tr_TR" />

  <!-- Twitter / X card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="The Last Signal" />
  <meta name="twitter:description" content="An interactive memorial to the rovers we left on Mars — Team Rosebital, NASA Space Apps Challenge." />
  <meta name="twitter:image" content="https://ahmet-selim-cetin.github.io/NASA-space-apps-rosebital/img/share-card.png" />
  <meta name="twitter:image:alt" content="Rosebital, GZOAL Tech Team" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="stage"></div>

  <!-- First-person drive -->
  <div id="drive" class="drive"></div>
  <div id="drive-ui" class="drive-ui">
    <div id="fx-dust" class="fx fx-dust"></div>
    <canvas id="fx-noise" class="fx fx-noise" width="192" height="108"></canvas>
    <div id="fx-black" class="fx-black"></div>
    <div class="hud hud-top">
      <p class="hud-title" id="h-title">MER-B · OPPORTUNITY</p>
      <p class="hud-sub"><span id="h-location" data-i18n="drive.location"></span><span id="h-sol-wrap"> · SOL <span id="h-sol">5100</span></span><span id="h-season" data-i18n="sp.season" hidden></span></p>
    </div>
    <div class="drive-actions">
      <button class="btn btn-hud" id="d-sound" aria-label="Sound"><span id="d-sound-icon">🔊</span></button>
      <button class="btn btn-hud" id="d-view"><span data-i18n="drive.view"></span> <kbd>C</kbd></button>
      <button class="btn btn-hud" id="d-exit"><span data-i18n="panel.back"></span></button>
    </div>
    <div class="hud hud-telemetry" id="h-telemetry">
      <div class="gauge wide">
        <span class="g-label" data-i18n="drive.battery"></span>
        <span class="g-value"><b id="h-battery">100</b> %</span>
        <span class="g-bar"><i id="h-battery-bar"></i></span>
      </div>
      <div class="gauge wide">
        <span class="g-label" data-i18n="drive.speed"></span>
        <span class="g-value"><b id="h-speed">0.0</b> cm/s</span>
        <span class="g-bar"><i id="h-speed-bar"></i></span>
      </div>
      <div class="gauge"><span class="g-label" data-i18n="drive.solar"></span><span class="g-value"><b id="h-solar">100</b> %</span></div>
      <div class="gauge"><span class="g-label" data-i18n="drive.tau"></span><span class="g-value">τ <b id="h-tau">0.6</b></span></div>
      <div class="gauge"><span class="g-label" data-i18n="drive.temp"></span><span class="g-value"><b id="h-temp">-28</b> °C</span></div>
      <div class="gauge"><span class="g-label" data-i18n="drive.heading"></span><span class="g-value"><b id="h-heading">000° N</b></span></div>
      <div class="gauge"><span class="g-label" data-i18n="drive.trip"></span><span class="g-value"><b id="h-trip">0.0</b> m</span></div>
    </div>
    <!-- Ingenuity flight telemetry (shown instead of the rover's while flying) -->
    <div class="hud hud-telemetry hud-flight" id="f-telemetry">
      <div class="gauge wide">
        <span class="g-label" data-i18n="fly.nav"></span>
        <span class="g-value"><b id="f-nav">100</b> %</span>
        <span class="g-bar"><i id="f-nav-bar"></i></span>
      </div>
      <div class="gauge"><span class="g-label" data-i18n="fly.clock"></span><span class="g-value"><b id="f-clock">0.0</b> s</span></div>
      <div class="gauge"><span class="g-label" data-i18n="fly.alt"></span><span class="g-value"><b id="f-alt">0.0</b> m</span></div>
      <div class="gauge"><span class="g-label" data-i18n="fly.speed"></span><span class="g-value"><b id="f-speed">0.0</b> m/s</span></div>
      <div class="gauge"><span class="g-label" data-i18n="drive.heading"></span><span class="g-value"><b id="f-heading">000° N</b></span></div>
    </div>
    <!-- Spirit: the last winter (shown instead of the rover's telemetry) -->
    <div class="hud hud-telemetry hud-spirit" id="sp-telemetry">
      <div class="gauge wide">
        <span class="g-label" data-i18n="sp.energy"></span>
        <span class="g-value"><b id="sp-energy">100</b> %</span>
        <span class="g-bar"><i id="sp-energy-bar"></i></span>
      </div>
      <div class="gauge wide">
        <span class="g-label" data-i18n="sp.freed"></span>
        <span class="g-value"><b id="sp-freed">0</b> cm</span>
        <span class="g-bar"><i id="sp-freed-bar"></i></span>
      </div>
      <div class="gauge"><span class="g-label" data-i18n="sp.heaters"></span><span class="g-value"><b id="sp-heaters" data-i18n="sp.on"></b></span></div>
      <div class="gauge"><span class="g-label" data-i18n="sp.radio"></span><span class="g-value"><b id="sp-radio" data-i18n="sp.on"></b></span></div>
      <div class="gauge"><span class="g-label" data-i18n="sp.wheels"></span><span class="g-value"><b id="sp-wheels" data-i18n="sp.still"></b></span></div>
      <div class="gauge"><span class="g-label" data-i18n="drive.heading"></span><span class="g-value"><b id="sp-heading">000° N</b></span></div>
    </div>
    <ol id="d-log" class="hud drive-log"></ol>
    <p class="drive-help hidden" id="drive-help" data-i18n="drive.help"></p>
    <div class="touch-pad" aria-hidden="true">
      <button data-axis="turn" data-v="1">◀</button>
      <div class="touch-col">
        <button data-axis="fwd" data-v="1">▲</button>
        <button data-axis="fwd" data-v="-1">▼</button>
      </div>
      <button data-axis="turn" data-v="-1">▶</button>
      <div class="touch-col flight-only">
        <button data-axis="alt" data-v="1">⤒</button>
        <button data-axis="alt" data-v="-1">⤓</button>
      </div>
    </div>
  </div>
  <!-- Ending -->
  <section id="ending" class="ending" aria-hidden="true">
    <img class="ending-logo" src="assets/rosebital-pill.svg" width="101" height="34" alt="Rosebital" />
    <div class="ending-inner">
      <p class="eyebrow" id="e-kicker" data-i18n="end.kicker"></p>
      <h2 id="e-title" data-i18n="end.title"></h2>
      <p class="ending-body" id="e-body" data-i18n="end.body"></p>
      <dl class="ending-stats">
        <div><dt data-i18n="panel.planned"></dt><dd id="e-planned">90 <span data-i18n="panel.sols"></span></dd></div>
        <div><dt data-i18n="panel.lasted"></dt><dd id="e-lasted"><span data-i18n="end.sols"></span> <span data-i18n="panel.sols"></span></dd></div>
        <div><dt data-i18n="panel.distance"></dt><dd id="e-distance"><span data-i18n="end.km"></span> km</dd></div>
      </dl>
      <p class="ending-closing" id="e-closing" data-i18n="end.closing"></p>
      <div class="ending-actions">
        <button class="btn btn-primary" id="e-back"><span data-i18n="panel.back"></span></button>
        <button class="btn btn-ghost" id="e-again"><span id="e-again-label" data-i18n="end.again"></span></button>
      </div>
    </div>
  </section>
  <div id="fade" class="fade"><p id="fade-text"></p></div>

  <!-- Top bar -->
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span><span data-i18n="title.top"></span>&nbsp;<em data-i18n="title.bottom"></em></div>
    <div class="top-right">
      <div class="lang-switch world-switch" role="group" aria-label="World">
        <button data-world="mars" data-i18n="world.mars"></button>
        <button data-world="moon" data-i18n="world.moon"></button>
      </div>
      <div class="lang-switch" role="group" aria-label="Language">
        <button data-lang="en">EN</button>
        <button data-lang="tr">TR</button>
      </div>
    </div>
  </header>

  <!-- Intro -->
  <section id="intro" class="intro">
    <div class="intro-inner">
      <img class="team-logo" src="assets/rosebital-logo.svg" width="240" height="120" alt="Rosebital, GZOAL Tech Team" />
      <h1><span data-i18n="intro.t1"></span><br /><em data-i18n="intro.t2"></em></h1>
      <p class="lead" data-i18n="intro.lead"></p>
      <button id="start" class="btn btn-primary" disabled>
        <span class="loader-text" data-i18n="intro.start"></span>
        <span class="progress"><span id="progress-bar"></span></span>
      </button>
      <button id="start-moon" class="btn btn-ghost" disabled><span data-i18n="intro.moon"></span></button>
    </div>
    <p class="font-credit">Font: <a href="https://www.fontspace.com/hacked-font-f28425" target="_blank" rel="noopener">Hacked</a> · David Libeau · CC BY 4.0</p>
  </section>

  <!-- Hint -->
  <p id="hint" class="hint hidden" data-i18n="hint.drag"></p>

  <!-- Rover panel -->
  <aside id="panel" class="panel" aria-hidden="true">
    <button class="panel-close" id="panel-close" aria-label="Close">×</button>
    <p class="eyebrow" id="p-place"></p>
    <h2 id="p-name"></h2>
    <p class="tagline" id="p-tagline"></p>
    <dl class="stats" id="p-stats">
      <div><dt data-i18n="panel.landed"></dt><dd id="p-landed"></dd></div>
      <div><dt id="p-last-label"></dt><dd id="p-last"></dd></div>
      <div><dt data-i18n="panel.planned"></dt><dd id="p-planned"></dd></div>
      <div><dt data-i18n="panel.lasted"></dt><dd id="p-lasted"></dd></div>
      <div class="wide"><dt data-i18n="panel.distance"></dt><dd id="p-distance"></dd></div>
      <div class="wide" id="p-coords-box"><dt id="p-coords-label"></dt><dd class="coord" id="p-coords"></dd></div>
    </dl>
    <dl class="stats" id="p-facts" hidden></dl>
    <div class="actions">
      <button class="btn btn-primary" id="p-drive"><span data-i18n="panel.drive"></span></button>
    </div>
    <section class="story" id="p-story-box">
      <p class="eyebrow" data-i18n="panel.storyTitle"></p>
      <ol id="p-story" class="timeline"></ol>
      <blockquote id="p-closing"></blockquote>
    </section>
  </aside>

  <!-- Picture story: 3 slides shown when a beacon is clicked -->
  <section id="slides" class="slides" aria-hidden="true" role="dialog" aria-labelledby="sl-title">
    <div class="sl-card">
      <button class="sl-close" id="sl-close" aria-label="Close">×</button>
      <figure class="sl-figure">
        <img id="sl-img" alt="">
        <figcaption><span id="sl-cap"></span> <small id="sl-credit"></small></figcaption>
      </figure>
      <div class="sl-body">
        <p class="sl-kicker"><span id="sl-name"></span> · <span id="sl-count"></span></p>
        <time id="sl-when"></time>
        <h2 id="sl-title"></h2>
        <p id="sl-text"></p>
        <div class="sl-dots" id="sl-dots"></div>
        <div class="sl-nav">
          <button class="btn btn-ghost" id="sl-prev" data-i18n="slides.prev"></button>
          <button class="btn btn-primary" id="sl-next" data-i18n="slides.next"></button>
          <button class="btn btn-ghost" id="sl-story" data-i18n="slides.story"></button>
          <button class="btn btn-primary" id="sl-drive" data-i18n="panel.drive"></button>
        </div>
      </div>
    </div>
  </section>

  <footer class="credit"><img class="credit-logo" src="assets/rosebital-pill.svg" width="101" height="34" alt="Rosebital" /><span id="credit" data-i18n="credit"></span></footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
